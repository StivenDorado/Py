<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>Document</title>

</head>
<body>
    <div class="w-50" style="margin:0 auto">
        <h3 class="text-center fw-bold">Registrar personas</h3>
        <form method="post" action="/agregarContacto" enctype="multipart/form-data" class="was-validated">
            <div class="mb-2">
                <label for="nombre">Nombre:</label>
                <input type="text" name="textNombre" class="form-control">
            </div>
            <div>
                <label for="apellido">Apellido:</label>
                <input type="text" name="textApellido" class="form-control">
            </div>
            <div>
                <label for="correo">Correo Electronico:</label>
                <input type="text" name="textCorreo" class="form-control">
            </div>

            <div>
                <label for="fileFoto">Correo Electronico:</label>
                <input type="file" name="fileFoto" class="form-control">
            </div>
            <br>
            <div>
                <button class=" bnt btn-secondary" >Enviar</button>
            </div>
        </form>
        <div class="mt-3">
            {{mensaje}}
        </div>
    </div>
</body>
</html>
