<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>Agregar Producto</title>
</head>
<body>
    <div class="container">
        <h1 class="text-center fw-bold">Agregar Producto</h1>
        <div>
            <form action="" method="post" enctype="multipart/form-data" class="was-validated">
                <div class="mt-2">
                    <label for="txtCodigo">Código</label>
                    <input type="text" name="txtCodigo" id="txtCodigo" class="form-control" required>
                </div>

                <div class="mt-2">
                    <label for="txtNombre">Nombre</label>
                    <input type="text" name="txtNombre" id="txtNombre" class="form-control" required>
                </div>

                <div class="mt-2">
                    <label for="txtPrecio">Precio</label>
                    <input type="number" name="txtPrecio" id="txtPrecio" class="form-control" required>
                </div>

                <div class="mt-2">
                    <label for="cbCategoria">Categoría</label>
                    <select name="cbCategoria" id="cbCategoria" class="form-select">
                        <option value="">Seleccione</option>
                        <option value="Electrodomestico">Electrodomestico</option>
                        <option value="Ropa">Ropa</option>
                        <option value="Calzado">Calzado</option>
                    </select>
                </div>

                <div class="mt-2">
                    <label for="fileFoto">Foto</label>
                    <input type="file" name="fileFoto" id="fileFoto" class="form-control">
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
        <div class="mt-3">
            {{mensaje}}
        </div>
    </div>
</body>
</html>
